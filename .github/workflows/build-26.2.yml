name: Build Minecraft 26.2

on:
  push:
    branches:
      - port/26.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Prepare Minecraft 26.2 sources
        run: python3 scripts/prepare_26_2_sources.py
      - run: chmod +x gradlew
      - name: Build Fabric mod
        run: ./gradlew clean test build --stacktrace
      - name: Build Paper-safe bridge client jar
        run: python3 scripts/make_paper_bridge_client_jar.py
      - name: Upload full Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-26.2
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload Paper bridge client artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-paper-bridge-client-26.2
          path: build/paper-bridge-client/*.jar
          if-no-files-found: error

  build-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Paper bridge
        run: gradle clean build --stacktrace
      - name: Verify Paper bridge runtime resources
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'config.yml'
      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: bridge/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/port/26.2' && startsWith(github.event.head_commit.message, 'release:')
    needs:
      - build-mod
      - build-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Download Paper-safe Fabric bridge client
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-paper-bridge-client-26.2
          path: artifacts/client

      - name: Download Paper Bridge plugin
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: artifacts/bridge

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          CLIENT_JAR="$(find artifacts/client -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          BRIDGE_JAR="$(find artifacts/bridge -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$CLIENT_JAR"
          test -n "$BRIDGE_JAR"
          cp "$CLIENT_JAR" release/ExtendedNoteBlockBridgeClient-Fabric-2.3.0-mc26.2.jar
          cp "$BRIDGE_JAR" release/ExtendedNoteBlockBridge-Paper-0.4.1-mc26.2.jar
          sha256sum release/*.jar > release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.3.0-mc26.2"
          cat > release-notes.md <<'EOF'
          # ExtendedNoteBlock Paper/Purpur Bridge 2.3.0 for Minecraft 26.2

          ## NBS Music Workshop in the Paper-safe client
          - Press **N** to open the NBS Music Workshop.
          - Reads `.nbs` files.
          - Imports `.mid` / `.midi` with tempo, velocity, pan and GM instrument information.
          - Imports WAV, MP3, OGG, AIFF/AIF and AU audio and converts detected pitches to NBS.
          - Includes local preview and projection preview tools.
          - Includes vanilla-only export tools for redstone lines, rail layouts, Litematica `.litematic`, vanilla structure `.nbt`, and datapack ZIP output.
          - JLayer is bundled for MP3 decoding.

          ## Paper safety
          - NBS/workshop classes are bytecode-scanned during CI.
          - Publishing fails if retained client classes reference ExtendedNoteBlock custom block/item/server registry code.
          - The unnecessary NBS planner dependency on `ExtendedNoteBlockEntity` was removed while keeping the same one-hour delay limit.

          ## Wireless/projection fixes
          - Dedicated NBS projection receivers now start on the transmitter's redstone rising edge only, so a completed song does not restart while power remains ON.
          - Receiver ON/OFF state is synchronized after server startup to avoid a stale redstone-block state.

          ## Existing 2.2 features retained
          - Conductor Wand Pos1/Pos2 selection and bulk note edits.
          - Global wireless redstone transmitter/receiver.
          - Per-receiver NBS projection timeline playback with pitch-cents support.
          - Vanilla fallback audio for clients without the Bridge Client.

          ## Install
          - **ExtendedNoteBlockBridgeClient-Fabric-2.3.0-mc26.2.jar** -> Fabric 26.2 client `mods/`.
          - **ExtendedNoteBlockBridge-Paper-0.4.1-mc26.2.jar** -> Paper/Purpur 26.2 server `plugins/`.

          Built and verified with Java 25 on GitHub Actions. In-game behavior still needs normal server/client testing.
          EOF

          gh release create "$TAG" \
            release/*.jar release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExtendedNoteBlock Paper Bridge 2.3.0 - Minecraft 26.2" \
            --notes-file release-notes.md
