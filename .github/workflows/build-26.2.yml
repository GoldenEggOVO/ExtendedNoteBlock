name: Build Minecraft 26.2

on:
  push:
    branches:
      - port/26.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Prepare Minecraft 26.2 sources
        run: python3 scripts/prepare_26_2_sources.py
      - run: chmod +x gradlew
      - name: Build Fabric mod
        run: ./gradlew clean test build --stacktrace
      - name: Build Paper-safe bridge client jar
        run: python3 scripts/make_paper_bridge_client_jar.py
      - name: Upload full Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-26.2
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload Paper bridge client artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-paper-bridge-client-26.2
          path: build/paper-bridge-client/*.jar
          if-no-files-found: error

  build-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Paper bridge
        run: gradle clean build --stacktrace
      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: bridge/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/port/26.2' && startsWith(github.event.head_commit.message, 'release:')
    needs:
      - build-mod
      - build-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Download Paper-safe Fabric bridge client
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-paper-bridge-client-26.2
          path: artifacts/client

      - name: Download Paper Bridge plugin
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: artifacts/bridge

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          CLIENT_JAR="$(find artifacts/client -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          BRIDGE_JAR="$(find artifacts/bridge -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$CLIENT_JAR"
          test -n "$BRIDGE_JAR"
          cp "$CLIENT_JAR" release/ExtendedNoteBlockBridgeClient-Fabric-2.1.2-mc26.2.jar
          cp "$BRIDGE_JAR" release/ExtendedNoteBlockBridge-Paper-0.2.0-mc26.2.jar
          sha256sum release/*.jar > release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.2-mc26.2"
          cat > release-notes.md <<'EOF'
          # ExtendedNoteBlock Paper/Purpur Bridge for Minecraft 26.2

          This release fixes the creative-inventory disconnect seen when the full ExtendedNoteBlock content mod was used against a Paper/Purpur server.

          ## Install these two files
          - **ExtendedNoteBlockBridgeClient-Fabric-2.1.2-mc26.2.jar** — Fabric 26.2 client `mods/` folder.
          - **ExtendedNoteBlockBridge-Paper-0.2.0-mc26.2.jar** — Paper/Purpur 26.2 server `plugins/` folder.

          ## Important
          Paper/Purpur players must remove **ExtendedNoteBlock-Fabric-2.1.1-mc26.2.jar** (and other full ExtendedNoteBlock content-mod jars) from the client before installing the Bridge Client. Do not install both client jars together.

          The new Bridge Client is client-only and contains no ExtendedNoteBlock custom block, item, block-entity, menu, command, server networking, or full content-mod initializer classes. This prevents custom ItemStacks from entering `minecraft:set_creative_mode_slot` packets on a vanilla-registry Paper/Purpur server.

          Clients with the Bridge Client receive ExtendedNoteBlock sound payloads. Clients without the mod can still join normally and hear the vanilla note-block fallback provided by Bridge 0.2.0.

          Built with Java 25. The Bridge Client JAR is structurally checked in CI to reject registry/content classes before publishing.
          EOF

          gh release create "$TAG" \
            release/*.jar release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExtendedNoteBlock Paper Bridge 2.1.2 - Minecraft 26.2" \
            --notes-file release-notes.md
