name: Build Minecraft 26.2

on:
  push:
    branches:
      - port/26.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Prepare Minecraft 26.2 sources
        run: python3 scripts/prepare_26_2_sources.py
      - run: chmod +x gradlew
      - name: Build Fabric mod
        run: ./gradlew clean test build --stacktrace
      - name: Build Paper-safe bridge client jar
        run: python3 scripts/make_paper_bridge_client_jar.py
      - name: Upload full Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-26.2
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload Paper bridge client artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-paper-bridge-client-26.2
          path: build/paper-bridge-client/*.jar
          if-no-files-found: error

  build-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Paper bridge
        run: gradle clean build --stacktrace
      - name: Verify Paper bridge runtime resources
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'config.yml'
      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: bridge/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/port/26.2' && startsWith(github.event.head_commit.message, 'release:')
    needs:
      - build-mod
      - build-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Download Paper-safe Fabric bridge client
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-paper-bridge-client-26.2
          path: artifacts/client

      - name: Download Paper Bridge plugin
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: artifacts/bridge

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          CLIENT_JAR="$(find artifacts/client -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          BRIDGE_JAR="$(find artifacts/bridge -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$CLIENT_JAR"
          test -n "$BRIDGE_JAR"
          cp "$CLIENT_JAR" release/ExtendedNoteBlockBridgeClient-Fabric-2.2.0-mc26.2.jar
          cp "$BRIDGE_JAR" release/ExtendedNoteBlockBridge-Paper-0.4.0-mc26.2.jar
          sha256sum release/*.jar > release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.2.0-mc26.2"
          cat > release-notes.md <<'EOF'
          # ExtendedNoteBlock Paper/Purpur Bridge 2.2.0 for Minecraft 26.2

          This release begins the full Paper/Purpur feature port instead of only providing sound playback.

          ## New: Conductor Wand core
          - The vanilla carrier is still `minecraft:blaze_rod`.
          - Left-click a block with the marked Conductor Wand to set Pos1.
          - Right-click a block to set Pos2.
          - `/enb wand info` shows the current cuboid.
          - `/enb wand clear` clears it.
          - `/enb wand set <note|instrument|velocity|sustain|delay|fadein|fadeout> <value>` bulk-edits all bridge Extended Note Blocks inside the selection.
          - A configurable selection-volume safety cap is included.

          ## New: Global wireless redstone core
          - Global Redstone Transmitter remains `minecraft:red_concrete` and reads real neighboring redstone power.
          - Global Redstone Receiver remains `minecraft:green_concrete` while OFF.
          - While ON, the receiver temporarily becomes `minecraft:redstone_block`, giving vanilla circuits a real strength-15 output.
          - Transmitters adjacent to an NBS Projection Receiver are routed only to that receiver rather than the global bus.

          ## New: NBS Projection playback core
          - Projection Receiver remains `minecraft:purple_concrete`.
          - Per-receiver projection timelines are persisted in `projections.yml`.
          - Dedicated adjacent transmitters can start/stop the projection.
          - `/enb projection add <delayMs> <note> <instrument> [velocity] [sustainTicks] [pitchCents]` adds timeline notes.
          - `/enb projection info`, `/enb projection clear`, and `/enb projection test` are available for testing.
          - The Bridge Client now supports `start_adv_sound` and `adv_update`, preserving projection pitch-cents playback for modded clients.
          - Clients without the Bridge Client still receive the closest vanilla Note Block fallback.

          ## Install
          - **ExtendedNoteBlockBridgeClient-Fabric-2.2.0-mc26.2.jar** -> Fabric 26.2 client `mods/`.
          - **ExtendedNoteBlockBridge-Paper-0.4.0-mc26.2.jar** -> Paper/Purpur 26.2 server `plugins/`.

          The client remains registry-safe: it does not register ExtendedNoteBlock custom items or blocks.
          Built and verified with Java 25 on GitHub Actions.
          EOF

          gh release create "$TAG" \
            release/*.jar release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExtendedNoteBlock Paper Bridge 2.2.0 - Minecraft 26.2" \
            --notes-file release-notes.md
