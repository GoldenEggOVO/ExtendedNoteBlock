name: Build Minecraft 26.2

on:
  push:
    branches:
      - port/26.2
      - release/26.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-26-2-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.scope.outputs.run-build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate documentation and repository metadata
        run: |
          python3 scripts/check_documentation.py
          python3 -m unittest discover -s scripts -p 'test_documentation.py' -v
      - name: Decide whether full builds are required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          run_build=true
          diff_range=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_build=true
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "port/26.2" && "$HEAD_MESSAGE" == release:* ]]; then
            run_build=true
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "release/26.2" ]]; then
            git fetch --no-tags origin port/26.2:refs/remotes/origin/port/26.2
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/port/26.2; then
              run_build=false
              echo "Skipping duplicate full build for a commit already present on port/26.2."
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${GITHUB_SHA}"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            diff_range="${BEFORE_SHA}..${GITHUB_SHA}"
          fi

          if [[ -n "$diff_range" ]]; then
            run_build=false
            while IFS= read -r path; do
              case "$path" in
                README.md|CHANGELOG.md|CONTRIBUTING.md|SECURITY.md|THIRD_PARTY_NOTICES.md|LICENSE|docs/*|.github/ISSUE_TEMPLATE/*|scripts/check_documentation.py|scripts/test_documentation.py)
                  ;;
                *)
                  run_build=true
                  echo "Full build required by: $path"
                  break
                  ;;
              esac
            done < <(git diff --name-only "$diff_range")
          fi

          echo "run-build=$run_build" >> "$GITHUB_OUTPUT"
          echo "Full builds required: $run_build"

  build-mod:
    needs: quality-gate
    if: needs.quality-gate.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Prepare Minecraft 26.2 sources
        run: python3 scripts/prepare_26_2_sources.py
      - name: Test packaging and listener-bank regression checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: chmod +x gradlew
      - name: Build Full Fabric mod
        run: ./gradlew clean test build --stacktrace
      - name: Build Paper-safe client jar with built-in item pack
        run: python3 scripts/make_paper_bridge_client_jar.py
      - name: Launch packaged Paper Client and check sound mixins
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          ./gradlew runPaperClientSmoke --stacktrace
          grep -q 'ENB_PAPER_CLIENT_SMOKE_OK' build/run/paperClientSmoke/logs/latest.log
      - name: Preserve Paper Client startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-client-startup-logs
          path: build/run/paperClientSmoke/logs/
          if-no-files-found: ignore
      - name: Install listener-pack audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build combined auto-download resource pack
        run: |
          ffmpeg -version
          python3 scripts/make_server_resource_pack.py
          PACK="$(find build/server-resource-pack -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$PACK"
          test "$(stat -c %s "$PACK")" -lt 50000000
      - name: Verify Full Fabric runtime jar
        shell: bash
        run: |
          set -euo pipefail
          FULL_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$FULL_JAR"
          jar tf "$FULL_JAR" | grep -qx 'com/atemukesu/extendednoteblock/ExtendedNoteBlock.class'
          jar tf "$FULL_JAR" | grep -qx 'com/atemukesu/extendednoteblock/item/ConductorWandItem.class'
      - name: Verify Paper Client item models and placed rendering
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_JAR="$(find build/paper-bridge-client -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$CLIENT_JAR"
          jar tf "$CLIENT_JAR" | grep -qx 'resourcepacks/bridge_items/pack.mcmeta'
          jar tf "$CLIENT_JAR" | grep -qx 'resourcepacks/bridge_items/assets/extendednoteblock/items/conductor_wand.json'
          jar tf "$CLIENT_JAR" | grep -qx 'resourcepacks/bridge_items/assets/minecraft/items/blaze_rod.json'
          unzip -p "$CLIENT_JAR" resourcepacks/bridge_items/assets/minecraft/items/blaze_rod.json | grep -q 'minecraft:custom_model_data'
          unzip -p "$CLIENT_JAR" resourcepacks/bridge_items/assets/minecraft/items/blaze_rod.json | grep -q 'extendednoteblock:conductor_wand'
          unzip -p "$CLIENT_JAR" resourcepacks/bridge_items/assets/minecraft/items/blaze_rod.json | grep -q 'minecraft:item/blaze_rod'
          jar tf "$CLIENT_JAR" | grep -qx 'com/atemukesu/extendednoteblock/bridgeclient/BridgeNoteBlockScreen.class'
          jar tf "$CLIENT_JAR" | grep -qx 'com/atemukesu/extendednoteblock/bridgeclient/BridgeWorldObjects.class'
          jar tf "$CLIENT_JAR" | grep -qx 'com/atemukesu/extendednoteblock/bridgeclient/BridgeBlockRenderModels.class'
          jar tf "$CLIENT_JAR" | grep -qx 'assets/extendednoteblock/models/block/c.json'
          jar tf "$CLIENT_JAR" | grep -qx 'assets/extendednoteblock/models/block/c_on.json'
          jar tf "$CLIENT_JAR" | grep -qx 'assets/extendednoteblock/models/block/global_redstone_transmitter.json'
          jar tf "$CLIENT_JAR" | grep -qx 'assets/extendednoteblock/models/block/global_redstone_receiver_on.json'
          jar tf "$CLIENT_JAR" | grep -qx 'assets/extendednoteblock/models/block/nbs_projection_receiver.json'
          if jar tf "$CLIENT_JAR" | grep -q '^com/atemukesu/extendednoteblock/item/'; then
            echo 'Unsafe Full Fabric item classes leaked into Paper Client' >&2
            exit 1
          fi
      - name: Upload Full Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-full-26.2
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload Paper Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-paper-client-26.2
          path: build/paper-bridge-client/*.jar
          if-no-files-found: error
      - name: Upload combined server resource pack
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-server-resources-26.2
          path: build/server-resource-pack/*.zip
          if-no-files-found: error

  build-bridge:
    needs: quality-gate
    if: needs.quality-gate.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Paper CustomModelData source
        run: python3 ../scripts/prepare_paper_custom_model_data.py
      - name: Prepare Paper placed interactions
        run: python3 ../scripts/prepare_paper_interactions.py
      - name: Prepare Paper placed render synchronization
        run: python3 ../scripts/prepare_paper_render_sync.py
      - name: Prepare automatic resource pack and vanilla listener audio
        run: |
          python3 ../scripts/prepare_paper_listener_pack.py
          GENERATED_SHA256="$(sha256sum src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java)"
          python3 ../scripts/prepare_paper_listener_pack.py
          test "$GENERATED_SHA256" = "$(sha256sum src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java)"
      - name: Verify vanilla-safe identity, interaction, render and listener bridge
        run: |
          grep -q 'PersistentDataType.STRING' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'bridgeTypeKey' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'getCustomModelDataComponent' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'customModelData.setStrings(List.of("extendednoteblock:" + type.id))' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'setCustomModelDataComponent' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'extendednoteblock:bridge_note_edit' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'registerIncomingPluginChannel(this, NOTE_SAVE' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'handlePlacedBridgeInteraction(player, block, type)' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'handleNoteSave(Player player, byte\[\] message)' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'extendednoteblock:bridge_object_sync' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'sendRenderSnapshot(Player player)' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'syncChangedRenderStates()' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'PlayerRegisterChannelEvent' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'public List<String> onTabComplete' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'sendHelp(sender, args.length >= 2 ? args\[1\] : null)' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'PlayerResourcePackStatusEvent' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'status.equals("ACCEPTED")' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'status.equals("DOWNLOADED")' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'setResourcePack(listenerPackId, listenerPackUrl, listenerPackSha1' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'ListenerResourcePackConfig.resolve' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'sendListenerResourcePack(event.getPlayer(), true), 40L' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'case "pack" -> handlePackCommand' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'action.equals("test")' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'ListenerSoundResolver.resolve' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          grep -q 'stopListenerSound(soundId)' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java
          if grep -q 'sendBlockChange' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java; then
            echo 'Server listener mode must not send fake world blocks' >&2
            exit 1
          fi
          if grep -q 'DataComponentTypes.ITEM_MODEL' src/main/java/com/goldenegggovo/extendednoteblock/bridge/ExtendedNoteBlockBridge.java; then
            echo 'Paper server must not force custom item_model IDs on no-pack clients' >&2
            exit 1
          fi
      - name: Build Paper/Purpur server plugin
        run: gradle clean build --stacktrace
      - name: Preserve Paper import test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-import-test-reports
          path: bridge/build/test-results/test/
          if-no-files-found: ignore
      - name: Verify Paper plugin runtime resources
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'config.yml'
          jar tf "$JAR" | grep -qx 'enb-release-pack.properties'
          jar tf "$JAR" | grep -qx 'com/atemukesu/extendednoteblock/bridgeprotocol/ProjectionImport.class'
          jar tf "$JAR" | grep -qx 'com/goldenegggovo/extendednoteblock/bridge/BridgeProjectionImporter.class'
          jar tf "$JAR" | grep -qx 'com/goldenegggovo/extendednoteblock/bridge/ListenerSoundResolver.class'
          jar tf "$JAR" | grep -qx 'com/goldenegggovo/extendednoteblock/bridge/ListenerResourcePackConfig.class'
          unzip -p "$JAR" config.yml | grep -q '__ENB_RESOURCE_PACK_URL__'
          unzip -p "$JAR" config.yml | grep -q '__ENB_RESOURCE_PACK_SHA1__'
          unzip -p "$JAR" enb-release-pack.properties | grep -q '__ENB_RESOURCE_PACK_URL__'
          unzip -p "$JAR" enb-release-pack.properties | grep -q '__ENB_RESOURCE_PACK_SHA1__'
      - name: Upload Paper server plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-paper-server-26.2
          path: bridge/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/port/26.2' && startsWith(github.event.head_commit.message, 'release:')
    needs:
      - quality-gate
      - build-mod
      - build-bridge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Full Fabric mod
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-full-26.2
          path: artifacts/full

      - name: Download Paper Client
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-paper-client-26.2
          path: artifacts/client

      - name: Download Paper/Purpur server plugin
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-paper-server-26.2
          path: artifacts/server

      - name: Download combined server resource pack
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-server-resources-26.2
          path: artifacts/server-resources

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          SERVER_VERSION="$(grep "^version = '" bridge/build.gradle | head -n1 | sed -E "s/version = '([^']+)'/\1/")"

          mkdir -p release
          FULL_JAR="$(find artifacts/full -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          CLIENT_JAR="$(find artifacts/client -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          SERVER_JAR="$(find artifacts/server -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          SERVER_PACK_ZIP="$(find artifacts/server-resources -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          test -n "$FULL_JAR"
          test -n "$CLIENT_JAR"
          test -n "$SERVER_JAR"
          test -n "$SERVER_PACK_ZIP"

          cp "$FULL_JAR" "release/ExtendedNoteBlock-Full-Fabric-${MOD_VERSION}-mc${MC_VERSION}.jar"
          cp "$CLIENT_JAR" "release/ExtendedNoteBlock-Paper-Client-Fabric-${MOD_VERSION}-mc${MC_VERSION}.jar"
          cp "$SERVER_JAR" "release/ExtendedNoteBlock-Paper-Server-${SERVER_VERSION}-mc${MC_VERSION}.jar"
          cp "$SERVER_PACK_ZIP" "release/ExtendedNoteBlock-Server-Resources-${MOD_VERSION}-mc${MC_VERSION}.zip"

          PACK_FILE="release/ExtendedNoteBlock-Server-Resources-${MOD_VERSION}-mc${MC_VERSION}.zip"
          SERVER_FILE="release/ExtendedNoteBlock-Paper-Server-${SERVER_VERSION}-mc${MC_VERSION}.jar"
          PACK_SHA1="$(sha1sum "$PACK_FILE" | cut -d' ' -f1)"
          PACK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${MOD_VERSION}-mc${MC_VERSION}/$(basename "$PACK_FILE")"
          python3 scripts/configure_release_resource_pack.py "$SERVER_FILE" "$PACK_URL" "$PACK_SHA1"

          unzip -p "$SERVER_FILE" config.yml | grep -Fq "$PACK_URL"
          unzip -p "$SERVER_FILE" config.yml | grep -Fq "$PACK_SHA1"
          unzip -p "$SERVER_FILE" enb-release-pack.properties | grep -Fq "$PACK_URL"
          unzip -p "$SERVER_FILE" enb-release-pack.properties | grep -Fq "$PACK_SHA1"
          sha256sum release/* > release/SHA256SUMS.txt

          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_ENV"
          echo "SERVER_VERSION=$SERVER_VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${MOD_VERSION}-mc${MC_VERSION}"
          NOTES="docs/releases/${MOD_VERSION}.md"
          test -s "$NOTES"

          gh release create "$TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExtendedNoteBlock ${MOD_VERSION} - Minecraft ${MC_VERSION}" \
            --notes-file "$NOTES"
