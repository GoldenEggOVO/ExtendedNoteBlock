name: Build Minecraft 26.2

on:
  push:
    branches:
      - port/26.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Prepare Minecraft 26.2 sources
        run: python3 scripts/prepare_26_2_sources.py
      - run: chmod +x gradlew
      - name: Build Fabric mod
        run: ./gradlew clean test build --stacktrace
      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-26.2
          path: build/libs/*.jar
          if-no-files-found: error

  build-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Paper bridge
        run: gradle clean build --stacktrace
      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: bridge/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/port/26.2'
    needs:
      - build-mod
      - build-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Download Fabric artifact
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-26.2
          path: artifacts/mod

      - name: Download Paper Bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: extendednoteblock-bridge-26.2
          path: artifacts/bridge

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          MOD_JAR="$(find artifacts/mod -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          BRIDGE_JAR="$(find artifacts/bridge -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$MOD_JAR"
          test -n "$BRIDGE_JAR"
          cp "$MOD_JAR" release/ExtendedNoteBlock-Fabric-2.1.1-mc26.2.jar
          cp "$BRIDGE_JAR" release/ExtendedNoteBlockBridge-Paper-0.2.0-mc26.2.jar
          sha256sum release/*.jar > release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.1-mc26.2"
          cat > release-notes.md <<'EOF'
          # ExtendedNoteBlock for Minecraft 26.2

          This release contains the Fabric client mod and the Paper/Purpur bridge plugin.

          - **ExtendedNoteBlock-Fabric-2.1.1-mc26.2.jar** — install on Fabric 26.2 clients in `mods/`.
          - **ExtendedNoteBlockBridge-Paper-0.2.0-mc26.2.jar** — install on Paper/Purpur 26.2 servers in `plugins/`.

          ## Bridge 0.2.0
          - Clients with ExtendedNoteBlock receive full extended MIDI pitch and instrument playback.
          - Clients without the mod can still join normally and now hear an automatic vanilla note-block fallback.
          - MIDI notes outside vanilla's F#3..F#5 range are clamped to the nearest vanilla-reproducible note.
          - General MIDI instrument families are mapped to the closest vanilla note-block instrument.
          - Modded clients are excluded from fallback playback to prevent doubled audio.

          Built and verified with Java 25 on GitHub Actions.
          EOF

          gh release create "$TAG" \
            release/*.jar release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExtendedNoteBlock 2.1.1 - Minecraft 26.2" \
            --notes-file release-notes.md
