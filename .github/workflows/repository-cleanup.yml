name: Clean superseded ENB release

on:
  push:
    branches: [port/26.2]
    paths: [.github/workflows/repository-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'GoldenEggOVO/ExtendedNoteBlock' && github.event.head_commit.message == 'chore: clean superseded 2.8.1 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve verified 2.9.0 and remove superseded 2.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/enb-release-cleanup.py
