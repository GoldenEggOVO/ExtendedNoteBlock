name: One-time cleanup of superseded 2.7.1 release

on:
  push:
    branches:
      - port/26.2
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.repository == 'GoldenEggOVO/ExtendedNoteBlock' &&
      github.event.head_commit.message == 'chore: clean superseded 2.7.1 release'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release identities and delete only v2.7.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = 'GoldenEggOVO/ExtendedNoteBlock'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          keep = 'v2.8.0-mc26.2'
          old = 'v2.7.1-mc26.2'

          def api(method, path):
              result = subprocess.run(
                  ['gh', 'api', '--method', method, f'repos/{repo}/{path}'],
                  check=True, capture_output=True, text=True)
              return json.loads(result.stdout) if result.stdout.strip() else None

          def release_identity(release):
              return (
                  release['id'], release['tag_name'], release['target_commitish'],
                  sorted((a['id'], a['name'], a['size'], a.get('digest'))
                         for a in release['assets']))

          before = api('GET', f'releases/tags/{keep}')
          keep_ref = api('GET', f'git/ref/tags/{keep}')
          superseded = api('GET', f'releases/tags/{old}')
          old_ref = api('GET', f'git/ref/tags/{old}')
          assert before['id'] == 383106567 and not before['draft']
          assert keep_ref['object']['sha'] == '5bf9cf34e2a2f9de0502b68ccbee9083ffb45aaf'
          assert superseded['id'] == 383102339
          assert superseded['tag_name'] == old and old != keep
          assert old_ref['object']['sha'] == '4ab9c648704413c67587abf034ac6a0bc37fdcdd'

          api('DELETE', f'releases/{superseded["id"]}')
          api('DELETE', f'git/refs/tags/{old}')

          after = api('GET', f'releases/tags/{keep}')
          after_ref = api('GET', f'git/ref/tags/{keep}')
          remaining = api('GET', 'releases?per_page=100')
          tag_refs = api('GET', 'git/matching-refs/tags/')
          assert release_identity(before) == release_identity(after)
          assert keep_ref['object'] == after_ref['object']
          assert old not in [r['tag_name'] for r in remaining]
          assert f'refs/tags/{old}' not in [r['ref'] for r in tag_refs]
          print(f'Deleted only {old}; {keep} and every published asset are unchanged.')
          PY
