name: Remove superseded ExtendedNoteBlock release

on:
  push:
    branches:
      - port/26.2
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the superseded 2.11.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/383430028"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.11.0-mc26.2"
