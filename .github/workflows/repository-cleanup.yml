name: One-time release cleanup

on:
  push:
    branches:
      - port/26.2

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: clean superseded releases' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v2.7.0-mc26.2 v2.7.1-mc26.2; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" >/dev/null 2>&1 && \
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
            fi
          done
