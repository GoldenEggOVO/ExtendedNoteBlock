name: One-time repository cleanup

on:
  push:
    branches:
      - port/26.2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: run repository cleanup'
    runs-on: ubuntu-latest
    env:
      KEEP_TAG: v2.7.0-mc26.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize release branch trigger
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#release/three-editions#release/26.2#g' .github/workflows/build-26.2.yml
          if ! git diff --quiet -- .github/workflows/build-26.2.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/build-26.2.yml
            git commit -m 'chore: normalize long-lived branch names'
            git push origin HEAD:port/26.2
          fi

      - name: Delete old temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/three-editions || true

      - name: Delete old releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          for tag in "${tags[@]}"; do
            if [[ "$tag" == "$KEEP_TAG" ]]; then
              echo "Keeping $tag"
              continue
            fi
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
