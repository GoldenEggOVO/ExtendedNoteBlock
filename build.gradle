plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version + '+mc' + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "extendednoteblock" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation 'net.objecthunter:exp4j:0.4.8'
    include 'net.objecthunter:exp4j:0.4.8'

    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Test the packaged Paper edition in a production Fabric client. Its classpath
// must not accidentally include the Full mod's source-set outputs or JAR.
sourceSets {
    paperClientSmoke {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
    }
}

tasks.register('paperClientSmokeJar', Jar) {
    from sourceSets.paperClientSmoke.output
    archiveFileName = 'enb-paper-client-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('test-mods')
}

tasks.register('runPaperClientSmoke', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('paperClientSmokeJar')
    mods.setFrom(configurations.productionRuntimeMods, tasks.named('paperClientSmokeJar'),
            layout.buildDirectory.file("paper-bridge-client/ExtendedNoteBlock-Paper-Client-Fabric-${project.mod_version}-mc${project.minecraft_version}.jar"))
    runDir = layout.buildDirectory.dir('run/paperClientSmoke')
    useXVFB = true
    jvmArgs.addAll('-Xmx2G', '-Dorg.lwjgl.glfw.checkThread0=false')
}

test {
    useJUnitPlatform()
}

processResources {
    includeEmptyDirs = false
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
