name: ExtendedNoteBlockBridge
version: '${version}'
main: com.goldenegggovo.extendednoteblock.bridge.ExtendedNoteBlockBridge
api-version: '26.2'
author: GoldenEggOVO
description: Paper/Purpur bridge for ExtendedNoteBlock Fabric clients.
commands:
  enb:
    description: Configure ExtendedNoteBlock bridge note blocks
    usage: /enb <set|info|remove|play|reload>
    permission: extendednoteblockbridge.use
permissions:
  extendednoteblockbridge.use:
    default: op
