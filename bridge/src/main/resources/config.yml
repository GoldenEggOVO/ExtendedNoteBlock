# ExtendedNoteBlockBridge configuration
# Minecraft 26.2 / Paper / Purpur

# Maximum distance used by player-facing bridge interactions.
interaction-range: 6

# Maximum distance at which bridge sounds are sent to clients.
audible-radius: 64

# Combined ENB item textures + listener sounds. Official release JARs replace the two
# placeholders below with the matching GitHub Release asset and its SHA-1.
resource-pack:
  enabled: true
  required: true
  # Keep this true for automatic upgrades to the pack embedded in each official
  # Paper Server release. Set false only when using your own URL / SHA-1 below.
  use-official-release: true
  id: "4ac1cf2c-ea6d-52a8-9605-8ecff682bd8d"
  url: "__ENB_RESOURCE_PACK_URL__"
  sha1: "__ENB_RESOURCE_PACK_SHA1__"
  prompt: "ExtendedNoteBlock 需要物品材质和音乐音色包 / requires its item and sound pack."

wand:
  # Safety cap for conductor-wand cuboid edits.
  max-selection-volume: 262144

wireless-redstone:
  # 1 tick matches normal redstone responsiveness.
  poll-period-ticks: 1

litematic-import:
  # Restores already placed vanilla carriers; does not place or generate blocks.
  max-notes: 75000
  anchor-range: 64
  checks-per-tick: 512

# Global Redstone Receiver implementation note:
# its inventory/placement carrier is GREEN_CONCRETE. While the receiver is ON,
# the plugin temporarily changes the world block to REDSTONE_BLOCK so vanilla
# redstone components receive a real 15-strength signal. It changes back to
# GREEN_CONCRETE when the global signal turns off.
