plugins {
    id 'java'
}

group = 'com.goldenegggovo.extendednoteblock.bridge'
version = '0.10.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.116.1'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.+'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

// This directory contains only the pure-Java bridge wire format, no Fabric classes.
sourceSets.main.java.srcDir('../src/main/java/com/atemukesu/extendednoteblock/bridgeprotocol')

test {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
    afterSuite { descriptor, result ->
        if (!descriptor.parent && result.skippedTestCount > 0) {
            throw new GradleException('Bridge tests must execute; MockBukkit unsupported APIs cannot silently skip validation')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
